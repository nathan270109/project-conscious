<div class="header-container" id="top" (keydown.escape)="closeMenu()">

    <div class="fixed-left">
        <a routerLink="/home" class="logo-link">
            <img class="logo" src="/assets/logo-white.png" alt="Logo da startup Project Conscious">
            <span class="wordmark">Project Conscious</span>
        </a>
    </div>

    <div class="scrolling-nav">
        <nav class="nav" aria-label="Navegação principal">
            <a routerLink="/home">Início</a>
            <a routerLink="/home" fragment="section-sobre-o-projeto">Sobre</a>
            <a routerLink="/home" fragment="section-como-funciona">Como funciona</a>
            <a routerLink="/projects/new">Diagnóstico</a>
            <a routerLink="/home" fragment="contato">Contato</a>
        </nav>
    </div>

    <div class="container-right">
        <div class="scrolling-button">
            <div class="botao">
                <a routerLink="/login"><span>Entrar</span></a>
            </div>
        </div>

        <button #menuToggle class="fixed-right" type="button" (click)="toggleMenu()"
            aria-label="Abrir menu de navegação" aria-controls="header-menu"
            [attr.aria-expanded]="isMenuOpen()">
            <span aria-hidden="true">☰</span>
        </button>


    </div>

    <div class="overlay" [class.open]="isMenuOpen()" (click)="closeMenu()"></div>

    <div id="header-menu" class="sidebar-menu" [class.open]="isMenuOpen()"
        [attr.inert]="isMenuOpen() ? null : ''" [attr.aria-hidden]="!isMenuOpen()">
        <div class="sidebar-header">
            <button type="button" class="close-btn" (click)="closeMenu()" aria-label="Fechar menu do side-bar">&times;</button>
        </div>
        
        <ul class="sidebar-links" aria-label="links de navegação dentro do side-bar">
            <li><a routerLink="/home" (click)="closeMenu()">Início</a></li>
            <li><a routerLink="/home" fragment="section-sobre-o-projeto" (click)="closeMenu()">Sobre</a></li>
            <li><a routerLink="/home" fragment="section-como-funciona" (click)="closeMenu()">Como funciona</a></li>
            <li><a routerLink="/projects/new" (click)="closeMenu()">Diagnóstico</a></li>
            <li><a routerLink="/home" fragment="contato" (click)="closeMenu()">Contato</a></li>
            <li><a routerLink="/login" (click)="closeMenu()">Login</a></li>
        </ul>
    </div>
</div>
