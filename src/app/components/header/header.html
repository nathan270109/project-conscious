<div class="header-container" (keydown.escape)="closeMenu()">

    <div class="fixed-left">
        <a routerLink="/home" class="logo-link">
            <img class="logo" src="/assets/logo-black.png" alt="Project Conscious — início">
        </a>
    </div>

    <div class="scrolling-nav">
        <nav class="nav" aria-label="Navegação principal">
            <a routerLink="/home">Início</a>
            <a routerLink="/">Sobre</a>
            <a routerLink="/">Contato</a>
        </nav>
    </div>

    <div class="container-right">
        <div class="scrolling-button">
            <div class="botao">
                <a routerLink="/login"><span data-hover="Login">Login</span></a>
            </div>
        </div>

        <button #menuToggle class="fixed-right" type="button" (click)="toggleMenu()"
            aria-label="Abrir menu de navegação" aria-controls="header-menu"
            [attr.aria-expanded]="isMenuOpen()">
            <span aria-hidden="true">☰</span>
        </button>


    </div>

    <div class="overlay" [class.open]="isMenuOpen()" (click)="closeMenu()"></div>

    <div id="header-menu" class="sidebar-menu" [class.open]="isMenuOpen()"
        [attr.inert]="isMenuOpen() ? null : ''" [attr.aria-hidden]="!isMenuOpen()">
        <div class="sidebar-header">
            <button type="button" class="close-btn" aria-label="Fechar menu" (click)="closeMenu()">&times;</button>
        </div>
        
        <ul class="sidebar-links">
            <li><a routerLink="/home" (click)="closeMenu()">Início</a></li>
            <li><a routerLink="/" (click)="closeMenu()">Sobre</a></li>
            <li><a routerLink="/" (click)="closeMenu()">Contato</a></li>
        </ul>
    </div>
</div>
