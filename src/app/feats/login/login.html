<section class="secao-login">
    <div class="login-container">
        <div class="login">
            <div class="logo">
                <img src="/assets/logo-white.png" alt="Project Conscious">
            </div>

            <div class="login-titulo">
                <h3>OLÁ DE NOVO!</h3>
            </div>

            <div class="login-formulario">
                <div class="formulario-container">
                    <form>
                        <div class="formulario">
                            <label for="email">Email</label>
                            <input id="email" type="email" placeholder="Digite seu email">
                        </div>

                        <div class="formulario">
                            <label for="senha">Senha</label>
                            <input id="senha" type="password" placeholder="Digite sua senha">
                        </div>

                        <div class="login-cadastro">
                            <a class="clique-aqui" routerLink=""><span>Esqueceu a senha?</span></a>
                        </div>

                        <button type="submit">Login</button>
                    </form>
                </div>

                <div class="login-ou">
                    <div class="linha"></div>
                    <span>ou</span>
                    <div class="linha"></div>
                </div>

                <div class="formulario-box">
                    <div class="conectar">
                        <div class="card">
                            <a routerLink=""><img src="/assets/logo-google.png" alt="google"></a> 
                        </div>

                        <div class="card">
                            <a routerLink=""><img src="/assets/logo-apple.png" alt="apple"></a>
                        </div>

                        <div class="card">
                            <a routerLink=""><img src="/assets/logo-facebook.png" alt="facebook"></a>
                        </div>
                    </div>

                    <div class="formulario-texto">
                        <p>Não tem uma conta? <a routerLink=""><span>Cadastre-se</span></a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
