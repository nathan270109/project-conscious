<section class="secao-login">
    <div class="login-container">
        <div class="login">
            <div class="logo">
                <img src="/assets/logo-white.png" alt="Project Conscious">
            </div>

            <div class="login-titulo">
                <h3>OLÁ DE NOVO!</h3>
            </div>

            <div class="login-formulario">
                <div class="formulario-container">
                    <form (submit)="onSubmit($event)">
                        <div class="formulario">
                            <label for="email">Email</label>
                            <input id="email" name="email" type="email" autocomplete="email" required placeholder="Digite seu email">
                        </div>

                        <div class="formulario">
                            <label for="senha">Senha</label>
                            <input id="senha" name="senha" type="password" autocomplete="current-password" required placeholder="Digite sua senha">
                        </div>

                        <div class="login-cadastro">
                            <button class="clique-aqui" type="button" disabled>Esqueceu a senha?</button>
                        </div>

                        <button class="botao-login" type="submit">Login</button>
                        @if (statusMessage) {
                            <p class="login-status" role="status">{{ statusMessage }}</p>
                        }
                    </form>
                </div>

                <div class="login-ou">
                    <div class="linha"></div>
                    <span>ou</span>
                    <div class="linha"></div>
                </div>

                <div class="formulario-box">
                    <div class="conectar">
                        <div class="card">
                            <button type="button" disabled aria-label="Entrar com Google — indisponível"><img src="/assets/logo-google.png" alt=""></button>
                        </div>

                        <div class="card">
                            <button type="button" disabled aria-label="Entrar com Apple — indisponível"><img src="/assets/logo-apple.png" alt=""></button>
                        </div>

                        <div class="card">
                            <button type="button" disabled aria-label="Entrar com Facebook — indisponível"><img src="/assets/logo-facebook.png" alt=""></button>
                        </div>
                    </div>

                    <div class="formulario-texto">
                        <p>Não tem uma conta? <button type="button" disabled>Cadastre-se</button></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
