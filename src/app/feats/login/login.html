<section class="secao-login">
    <div class="login-container">
        <div class="login">
            <div class="logo">
                <img src="/assets/logo-black.png" alt="logo" width="50" height="50">
            </div>

            <div class="login-titulo">
                <h2>Olá de novo!</h2>
            </div>

            <div class="login-formulario">
                <div class="formulario-container">
                    <form>
                        <div class="formulario">
                            <label for="email">Email</label>
                            <input id="email" type="email" placeholder="Digite seu email">
                        </div>

                        <div class="formulario">
                            <label for="senha">Senha</label>
                            <input id="senha" type="password" placeholder="Digite sua senha">
                        </div>

                        <div class="login-cadastro">
                            <p>Esqueceu sua senha? <span>Clique aqui</span></p>
                        </div>

                        <button type="submit">Login</button>
                    </form>
                </div>

                <div class="formulario-box">
                    <div class="conectar">
                        <div class="card">
                            <img src="/assets/logo-google.png" alt="google" width="20" height="20">
                        </div>

                        <div class="card">
                            <img src="/assets/logo-apple.png" alt="apple" width="20" height="20">
                        </div>

                        <div class="card">
                            <img src="/assets/logo-facebook.png" alt="facebook" width="20" height="20">
                        </div>
                    </div>

                    <div class="formulario-texto">
                        <p>Não tem uma conta? <span>Cadastre-se</span></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
